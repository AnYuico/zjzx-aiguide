global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: zjzx-agent-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8520

  - job_name: zjzx-server-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8500

  - job_name: zjzx-business-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8511
          - host.docker.internal:8512
          - host.docker.internal:8513
          - host.docker.internal:8514
          - host.docker.internal:8515

  - job_name: zjzx-rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - zjzx-rabbitmq:15692
